services:
  web:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      SQLITE_DB_PATH: /app/data/sablon.sqlite
      SESSION_PASSWORD: ${SESSION_PASSWORD:-please-change-me-to-32-chars-minimum-secret}
      MEDIA_DIR: /app/media
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@sablon.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      PORT: 4321
      HOST: 0.0.0.0
    volumes:
      - media:/app/media
      - data:/app/data
    ports:
      - "${WEB_PORT:-8080}:4321"

volumes:
  media:
  data:
